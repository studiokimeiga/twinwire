name: release
# Publishes to npm when a version tag (v1.2.3) is pushed, after the full checks, with provenance.
# Needs the repository secret NPM_TOKEN (an npm automation token), or npm trusted publishing set up for this workflow.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: the tag matches package.json
        run: test "v$(node -p 'require(\"./package.json\").version')" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm run test:native
      - name: publish (unless this version is already on npm)
        run: |
          if npm view "twinwire@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo "already on npm"; else npm publish --provenance --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk "/^## ${GITHUB_REF_NAME#v} /{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
