name: networking-gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      webtransport_soak:
        description: Also run real browser QUIC lifecycle soaks
        type: boolean
        default: false
      wt_soak_seconds:
        description: Short validation override (0 uses soak_minutes)
        type: number
        default: 0
      webtransport_only:
        description: Run only native WebTransport browser gates
        type: boolean
        default: false
      soak_minutes:
        description: Duration of each independent lifecycle soak
        type: choice
        required: true
        default: '10'
        options: ['10', '30', '60']
permissions:
  contents: read
concurrency:
  group: networking-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: ${{ !inputs.webtransport_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Record deterministic FPS lab metrics
        if: matrix.node == 22
        run: |
          set -euo pipefail
          mkdir -p artifacts/fps-lab
          node tools/fps-lab.mjs | tee artifacts/fps-lab/results.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const metrics = JSON.parse(readFileSync('artifacts/fps-lab/results.json', 'utf8'));
          assert.equal(metrics.tickHz, 64);
          assert.ok(Array.isArray(metrics.results) && metrics.results.length > 0);
          for (const row of metrics.results) assert.ok(row.shots > 0);
          NODE
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: fps-lab-matrix-node22
          path: artifacts/fps-lab/results.json
          retention-days: 7
      - run: npm run test:worker
      - run: npm run test:native
      - run: npm run bench -- --clients 50 --seconds 5
      - name: Compare against immutable published 2.3.0
        if: matrix.node == 22
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmark-baseline artifacts/transport
          npm pack twinwire@2.3.0 --ignore-scripts --silent --pack-destination .benchmark-baseline
          sha256sum .benchmark-baseline/twinwire-2.3.0.tgz > artifacts/transport/baseline-SHA256SUMS
          tar -xzf .benchmark-baseline/twinwire-2.3.0.tgz -C .benchmark-baseline
          ln -s ../../node_modules .benchmark-baseline/package/node_modules
          node tools/compare-transport.mjs --baseline .benchmark-baseline/package > artifacts/transport/endpoint-model.json
          for n in 1 2 3; do
            TWINWIRE_SDK_ROOT=.benchmark-baseline/package node tools/bench.mjs --clients 50 --seconds 5 > "artifacts/transport/baseline-$n.json"
            node tools/bench.mjs --clients 50 --seconds 5 > "artifacts/transport/candidate-$n.json"
          done
          node tools/assert-transport-comparison.mjs artifacts/transport
      - uses: actions/upload-artifact@v7
        if: always() && matrix.node == 22
        with:
          name: transport-comparison-node22
          path: artifacts/transport/
          retention-days: 7
  browsers:
    if: ${{ !inputs.webtransport_only }}
    name: browsers (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash tools/prepare-browser-runner.sh
      - run: npx playwright install --with-deps "$ENGINES"
      - run: npm run test:browser
      - run: IMPAIR=1 npm run test:browser
      - run: RTC=0 npm run test:browser
      - run: npm run test:example
      - run: RTC=1 npm run test:example
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results-${{ matrix.engine }}
          path: validation/browsers*.json
          retention-days: 3
  lifecycle-soak:
    if: ${{ !inputs.webtransport_only }}
    name: lifecycle soak (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.soak_minutes == '60' && 80 || inputs.soak_minutes == '30' && 50 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      SOAK_MINUTES: ${{ inputs.soak_minutes || '10' }}
      TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record the source and runner
        shell: bash
        run: |
          set -euo pipefail
          case "$SOAK_MINUTES" in 10|30|60) ;; *) exit 1 ;; esac
          mkdir -p artifacts/soak
          node --input-type=module <<'NODE' > artifacts/soak/context.json
          import os from 'node:os';
          import { execFileSync } from 'node:child_process';
          console.log(JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
            testHead: process.env.TEST_HEAD,
            node: process.version, platform: os.platform(), kernel: os.release(),
            cpus: os.cpus().length, cpuModel: os.cpus()[0]?.model, memoryBytes: os.totalmem(),
            minutes: Number(process.env.SOAK_MINUTES), clients: 48, hostile: 6,
            transport: 'WebSocket; worker-thread clients and server share one runner',
            randomness: 'Existing soak uses Math.random; this is an independent run, not an identical seeded schedule',
          }, null, 2));
          NODE
          sha256sum package-lock.json tools/soak.mjs > artifacts/soak/source-SHA256SUMS
      - run: npm ci
      - name: Churn and hostile-client soak
        shell: bash
        run: |
          set -euo pipefail
          npm run soak -- --minutes "$SOAK_MINUTES" --clients 48 --hostile 6 2>&1 | tee artifacts/soak/soak.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lifecycle-soak-node-${{ matrix.node }}
          path: artifacts/soak/
          retention-days: 3
  webtransport:
    name: WebTransport (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      ENGINES: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/check-wt-native.mjs
      - run: bash tools/prepare-browser-runner.sh
      - run: npx playwright install --with-deps "$ENGINES"
      - run: node tools/webtransport-e2e.mjs
      - run: IMPAIR=1 node tools/webtransport-e2e.mjs
      - name: Measure bounded tracing overhead
        if: matrix.engine == 'chromium'
        run: node tools/compare-tracing.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webtransport-${{ matrix.engine }}
          path: validation/webtransport*.json
          retention-days: 7
  webtransport-soak:
    if: ${{ inputs.webtransport_soak }}
    name: WT lifecycle soak (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.soak_minutes == '60' && 80 || inputs.soak_minutes == '30' && 50 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    env:
      ENGINES: ${{ matrix.engine }}
      SOAK_MINUTES: ${{ inputs.soak_minutes || '10' }}
      WT_SOAK_SECONDS: ${{ inputs.wt_soak_seconds || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/check-wt-native.mjs
      - run: bash tools/prepare-browser-runner.sh
      - run: npx playwright install --with-deps "$ENGINES"
      - run: node --expose-gc tools/webtransport-soak.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webtransport-soak-${{ matrix.engine }}
          path: validation/webtransport-soak-*.json
          retention-days: 7
