name: pages
# Builds the documentation site (website/) and deploys it to GitHub Pages: https://studiokimeiga.github.io/twinwire/
# The site's explainers run the library's own build, so the library is built first.
# Needs Pages enabled with "GitHub Actions" as the source (Settings > Pages).
on:
  push:
    branches: [main]
    paths: ['website/**', 'examples/starter/**', 'package.json', 'src/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix examples/starter
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        working-directory: website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
