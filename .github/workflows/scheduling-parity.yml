name: Reliable throughput and state age
on:
  workflow_dispatch:
  push:
    branches: [performance/reliable-parity-20261104]
    paths: ['src/core/budget.ts', 'tools/browser-performance*.mjs', 'tools/summarize-browser-performance.mjs', '.github/workflows/scheduling-parity.yml']
permissions:
  contents: read
concurrency:
  group: scheduling-parity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    name: reliable parity (${{ matrix.engine }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
        transport: [ws, rtc]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify immutable published baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir .performance-baseline
          npm pack twinwire@2.3.0 --ignore-scripts --silent --pack-destination .performance-baseline
          echo '5fd06c1f96c6506b63153c1ab32913f04a262d8eaeb4f30e20d5c3dc99b6fda2  .performance-baseline/twinwire-2.3.0.tgz' | sha256sum -c -
          tar -xzf .performance-baseline/twinwire-2.3.0.tgz -C .performance-baseline
          ln -s ../../node_modules .performance-baseline/package/node_modules
      - run: bash tools/prepare-browser-runner.sh
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Normal-traffic control, five alternating pairs
        run: node tools/browser-performance.mjs --baseline .performance-baseline/package --state-share 0.075 --profiles normal --seconds 12 --repetitions 5 --engine ${{ matrix.engine }} --transport ${{ matrix.transport }} --out artifacts/browser-performance/control
      - name: Minute-long overload, five alternating pairs
        run: node tools/browser-performance.mjs --baseline .performance-baseline/package --state-share 0.075 --profiles mixed-budget --seconds 60 --repetitions 5 --engine ${{ matrix.engine }} --transport ${{ matrix.transport }} --out artifacts/browser-performance/overload
      - name: Preserve every trial and require lower age with no fewer reliable events
        run: |
          node tools/summarize-browser-performance.mjs artifacts/browser-performance/control/report-${{ matrix.engine }}-${{ matrix.transport }}.json artifacts/browser-performance/overload/report-${{ matrix.engine }}-${{ matrix.transport }}.json --out artifacts/browser-performance/summary.json
          node --input-type=module -e "import fs from 'node:fs'; const s=JSON.parse(fs.readFileSync('artifacts/browser-performance/summary.json')); const c=s.comparisons.find(c=>c.profile==='mixed-budget'); if(!c?.lowerLatencyWithReliableParityDemonstrated) throw Error('Inspect the preserved latency/throughput failures');"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reliable-parity-${{ matrix.engine }}-${{ matrix.transport }}
          path: artifacts/browser-performance/
          retention-days: 30
