name = "twinwire-demo"
main = "worker.mjs"
compatibility_date = "2026-03-17"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/connect", "/health"]

[[durable_objects.bindings]]
name = "ARENA"
class_name = "ArenaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaRoom"]
